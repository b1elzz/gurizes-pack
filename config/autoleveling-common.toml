#Gurizes RPG Fantasy (progressao-economia.md §2.1 e §2.2, plano A).
#Chaves conferidas no arquivo gerado pelo AutoLeveling-1.20-1.19b. Valores por dimensão e por boss ficam no datapack
#Paxi gurizes_progressao (leveling_settings). O acréscimo por ato vem de /autoleveling level add (KubeJS 30_porteiros.js).

[Mobs]
	#Bosses da Campanha ficam fora do Auto Leveling: a escala deles é do mod (fórmula de grupo, campanha-bosses.md §2.1.1).
	#Bosses da Trilha e opcionais NÃO entram aqui: têm nível fixo em leveling_settings/entities.
	#Example: ["minecraft:zombie", "minecraft:skeleton"]
	"List of mobs that shouldn't be able to level up" = ["gurizes:guardiao_coroa_oca", "gurizes:escudeiro_oco", "gurizes:coroa_errante", "gurizes:escudo_cravado", "gurizes:matriarca_raiz_podre", "gurizes:raiz_sugadora", "gurizes:forjador_caido", "gurizes:mare_partida", "gurizes:olho_estelar", "gurizes:estrela_guardia", "gurizes:anel_estelar", "gurizes:eco_coroa", "gurizes:eco_raiz", "gurizes:eco_forja", "gurizes:eco_mare", "gurizes:rei_partido", "gurizes:metade_rei", "gurizes:metade_sombra", "gurizes:cavaleiro_partido", "gurizes:estandarte_plantado"]
	#If this list is not empty only these mobs will be able to level up
	#Example: ["minecraft:zombie", "minecraft:skeleton"]
	"List of mobs that should be able to level up" = []
	#Com o Neat (barra de vida sobre o mob), o nível aparece em toda barra e não só no mob para o qual você olha.
	"Always show mobs levels" = true
	"Only show levels when you look at the mob" = true
	#+4% de XP por nível.
	"Bonus experience per level" = 0.04
	"List of mobs that should have their levels always hidden" = []

[Attributes]
	#Bem menor que o do Cisco (+14% de dano por nível): vida +5%, dano +3,5%, armadura +3%, projétil/explosão +3%, velocidade +0,05%.
	#Contains a list of pairs of attributes and their bonuses per one level
	"Attributes bonuses per one level" = [["minecraft:generic.max_health", 0.05], ["minecraft:generic.attack_damage", 0.035], ["minecraft:generic.armor", 0.03], ["autoleveling:monster.projectile_damage_bonus", 0.03], ["autoleveling:monster.explosion_damage_bonus", 0.03], ["minecraft:generic.movement_speed", 5.0E-4]]

["Default levelling settings"]
	#Padrão = Overworld (L0 1, 1 nível a cada 200 blocos, 0,1 por bloco abaixo do nível do mar, aleatório 0–2).
	"Starting level" = 1
	#If this is equal to 0, there will be no maximum level
	"Maximum level" = 0
	"Level increase per one block distance from spawn" = 0.005
	"Level increase per one block deepness below sea level" = 0.1
	#If this is higher than 0, the level of monsters will be randomly increased by value between 0 and this value
	"Random level bonus" = 2
	#Sem aumento por dia: o tempo não deve punir o grupo que joga pouco.
	#If this is higher than 0, mobs level will increase every day by specified amount
	"Level bonus per day" = 0.0
	#Exponential level increase with distance
	level_power_per_distance = 0.0
	#Exponential level increase with deepness
	level_power_per_deepness = 0.0
